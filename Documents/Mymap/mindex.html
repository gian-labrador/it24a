<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maps</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>

</head>
<style>
    #map{
        height: 500px;
    }
    .popup-image{
        max-width: 200px;
        height: auto;
        object-fit: fill;
    }

    #locations{
        width: 250px;
    }

    .location{
        padding: 10px;
        border-bottom: 1px solid #eee;
    }

    .location:hover{
        background: #eee;
    }

    .container{
        display:flex;
        gap: 15px;
    }

    #map{
        height: 500px;
        flex:1;
    }
    .popup-image{
        max-width: 200px;
        height: auto;
        object-fit: fill;
    }
</style>

<body>
    <h1>Simple Map</h1>

    <div class="container">
        <div id="locations">
            <h3>locations</h3>
            <div id="Location-list"></div>
        </div>

        <div id="map"></div>
    </div>
</body>

<script>

    function initMap(mapDataUrl){

        const map = L.map('map').setView([8.360,124.868],17);

        const openStreetMap = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri'
        });

        fetch(mapDataUrl)
        .then(response => {
            if (!response.ok) {
                throw new Error('Failed to load map data');
            }
            return response.json();
        })
        .then(data => {
            data.forEach(pin => {
                const marker = L.marker([pin.lat, pin.lng]).addTo(map);
                const image = `<img src="${pin.image}" class="popup-image">`;

                marker.bindPopup(`
                    ${pin.title} <br>
                    <hr>
                    ${image}
                `);

                const item = document.createElement('div');
                item.className = 'location';
                item.textContent = pin.title;

                document.getElementById('Location-list').appendChild(item);

                item.onclick = () => {
                    map.flyTo([pin.lat, pin.lng], 18);
                    marker.openPopup();
                };

            });
        })
        .catch(error => {
            console.error('Error loading map data:', error);
        });

        const baseMaps = {
            "OpenStreetMap": openStreetMap,
            "Satellite": satellite
        };

        L.control.layers(baseMaps).addTo(map);

    }

    initMap('campus.map.json');

</script>

</html>
